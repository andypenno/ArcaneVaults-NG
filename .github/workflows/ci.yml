name: Build and test

on:
  pull_request:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.checks.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: checks
        run: echo "matrix=$(python3 tools/ci/pipeline.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build candidate
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize pinned submodules
        run: git submodule update --init --recursive --depth=1 --jobs=4
      - name: Set tool directory
        run: echo "AV_CI_WORK=$RUNNER_TEMP/arcanevault-wine" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman catatonit uidmap slirp4netns fuse-overlayfs g++
      - name: Restore dependency cache
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.AV_CI_WORK }}/download-cache
            ${{ env.AV_CI_WORK }}/release-tools
            ${{ env.AV_CI_WORK }}/xmake-packages
          key: wine-x64-${{ runner.os }}-${{ hashFiles('tools/ci/**', 'docs/wine/**', 'xmake.lua', 'xmake-requires.lock', '.gitmodules', 'release/inputs.json') }}
      - name: Provision Wine and MSVC
        run: python3 tools/ci/bootstrap_wine.py --work-dir "$AV_CI_WORK"
      - name: Build unverified candidate
        run: python3 tools/ci/pipeline.py candidate --container arcanevault-ci
      - name: Upload unverified candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-${{ github.sha }}
          overwrite: true
          path: .build/ci/candidate/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save dependency cache
        if: success() && github.event_name != 'pull_request' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.AV_CI_WORK }}/download-cache
            ${{ env.AV_CI_WORK }}/release-tools
            ${{ env.AV_CI_WORK }}/xmake-packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Remove CI container
        if: always()
        run: podman rm --force --ignore arcanevault-ci

  verify:
    name: Verify (${{ matrix.check }})
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize test inputs
        run: git submodule update --init --depth=1 extern/json lib/commonlibsse-ng
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.check == 'esp-editor'
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: tools/esp/packages.lock.json
      - name: Run verification
        run: python3 tests/run.py --suite release --test "$CHECK" --sanitize --output "results/ci/tests/$CHECK"
      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: check-${{ github.sha }}-${{ matrix.check }}
          overwrite: true
          path: results/ci/tests/${{ matrix.check }}/report.json
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      install_artifact_id: ${{ steps.install.outputs.artifact-id }}
    steps:
      - name: Require successful build and verification jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$VERIFY_RESULT" != success ]; then
            echo "::error::Candidate build or verification failed; inspect the named job logs."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download unverified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.sha }}
          path: .build/ci/candidate
      - name: Download required check reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: check-${{ github.sha }}-*
          path: results/ci/checks
      - name: Verify the exact ZIP and promote
        run: python3 tools/ci/pipeline.py publish
      - name: Upload verified install files
        id: install
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ArcaneVaults-NG-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/ci/install/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  cleanup:
    needs: release
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Remove temporary candidate and check reports
        env:
          GH_TOKEN: ${{ github.token }}
          AV_INSTALL_ARTIFACT_ID: ${{ needs.release.outputs.install_artifact_id }}
        run: python3 tools/ci/pipeline.py cleanup
