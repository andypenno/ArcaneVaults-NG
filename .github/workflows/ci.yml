name: Build and test

on:
  pull_request:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize pinned submodules
        run: git submodule update --init --recursive --depth=1 --jobs=4
      - name: Set tool directory
        run: echo "AV_CI_WORK=$RUNNER_TEMP/arcanevault-wine" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: tools/esp/packages.lock.json
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman catatonit uidmap slirp4netns fuse-overlayfs g++
      - name: Restore dependency cache
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.AV_CI_WORK }}/download-cache
            ${{ env.AV_CI_WORK }}/release-tools
            ${{ env.AV_CI_WORK }}/xmake-packages
          key: wine-x64-${{ runner.os }}-${{ hashFiles('tools/ci/**', 'docs/wine/**', 'xmake.lua', 'xmake-requires.lock', '.gitmodules', 'release/inputs.json') }}
      - name: Provision Wine and MSVC
        run: python3 tools/ci/bootstrap_wine.py --work-dir "$AV_CI_WORK"
      - name: Build and verify install ZIP
        run: python3 tools/release/build_release.py --container arcanevault-ci
      - name: Upload verified install ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ArcaneVaults-NG-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ArcaneVaults-NG.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save dependency cache
        if: success() && github.event_name != 'pull_request' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.AV_CI_WORK }}/download-cache
            ${{ env.AV_CI_WORK }}/release-tools
            ${{ env.AV_CI_WORK }}/xmake-packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            results/ci/
            results/releases/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove CI container
        if: always()
        run: podman rm --force --ignore arcanevault-ci
